name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.2
          path: .local/ArduinoJson
      - run: npm test
      - run: npm run test:firmware
      - run: npm run check:public
      - run: npm run check:generated
      - run: npm run benchmark
      - run: npm run benchmark:firmware
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -e esp32-s3-n16r8
